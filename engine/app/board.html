<!doctype html>
<html lang="ko" data-subject="수학">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>수업 화면 · 수업잇기</title>
<link rel="stylesheet" href="assets/vendor/fonts/fonts.css">
<link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
<link rel="stylesheet" href="assets/css/tokens.css"><!-- 공통: word-break: keep-all · prefers-reduced-motion 은 tokens.css -->
<link rel="stylesheet" href="assets/css/content.css">
<link rel="stylesheet" href="assets/css/ink.css">
<link rel="stylesheet" href="assets/css/book.css">
<link rel="stylesheet" href="assets/css/board.css">
<link rel="stylesheet" href="assets/css/lab.css">
</head>
<body class="board-body">
<div class="desk" id="desk">
  <div class="stage" id="stage">
    <header class="topbar">
      <button class="topbar__toc" id="btnToc" type="button" title="목차 · 개념 찾기 (T)"></button>
      <div class="topbar__crumb" id="crumb"></div>
      <div class="topbar__right">
        <div class="live-mini" id="liveMini" hidden></div>
        <button class="topbar__class" id="btnClass" type="button" title="반 바꾸기"></button>
        <button class="topbar__tools" id="btnTools" type="button" aria-haspopup="true" aria-expanded="false"></button>
        <button class="topbar__icon" id="btnFull" type="button" title="전체 화면 (F)" aria-label="전체 화면"></button>
      </div>
    </header>
    <main class="sheet" id="sheet" aria-live="polite"></main>
    <button class="booktab" id="bookTab" type="button" title="교과서 원본 펼치기 (B)"></button>
    <footer class="rail">
      <div class="rail__ink" id="inkDock"></div>
      <nav class="rail__chips" id="chips" aria-label="이 소단원의 화면"></nav>
      <div class="rail__nav">
        <span class="rail__count num" id="count"></span>
        <button class="navbtn" id="btnPrev" type="button" aria-label="이전 (←)"></button>
        <button class="navbtn navbtn--next" id="btnNext" type="button" aria-label="다음 (→)"></button>
      </div>
    </footer>
    <div class="layer" id="layer"></div>
  </div>
</div>
<noscript>이 화면은 자바스크립트가 켜져 있어야 열립니다.</noscript>
<script src="config.js"></script>
<script src="assets/vendor/katex/katex.min.js"></script>
<script src="assets/vendor/qrcode/qrcode.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/demo-seed.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/viz.js"></script>
<script src="assets/js/glossary.js"></script>
<script src="assets/js/ink.js"></script>
<script src="assets/js/book.js"></script>
<script src="assets/js/worksheet.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/lab.js"></script>
<script src="assets/js/labs/projection.js"></script>
<script src="assets/js/labs/terrain.js"></script>
<script src="assets/js/labs/orbit.js"></script>
<script src="assets/js/labs/gas.js"></script>
<script src="assets/js/labs/vector-ops.js"></script>
<script src="assets/js/labs/vector-box.js"></script>
<script src="assets/js/labs/vector-coord.js"></script>
<script src="assets/js/board.js"></script>
</body>
</html>
